name: Verify customer application
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test portal.tests
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-web.txt
      - name: Check production security configuration
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: carbon.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://carbon.example.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag maritime-carbon:ci .
